name: Python application

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.14"]

        steps:
            - uses: actions/checkout@v7
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install PDM
              uses: pdm-project/setup-pdm@v4
              with:
                  cache: true
                  cache-dependency-path: pdm.lock
            - name: Install dependencies
              run: |
                  pdm install --group dev
            - name: Lint with ruff
              run: |
                  pdm run lint
            - name: Test with pytest
              run: |
                  pdm run test
            - name: Check types with Mypy
              run: pdm run typecheck
            - name: Test browser helpers
              run: npm test

    docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Install Perfect Doc
              run: |
                  rustup update stable --no-self-update
                  cargo +stable install --locked --git https://github.com/btfranklin/perfect-doc.git --tag v0.1.0 perfect-doc
            - name: Check documentation offline
              run: perfect-doc check --offline --no-banner
