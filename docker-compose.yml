x-app-environment: &app-environment
  SQLITE_PATH: /data/db.sqlite3
  DATABASE_URL: ${DATABASE_URL:-}
  REDIS_URL: redis://redis:6379/0
  TASKS_BACKEND: django_tasks_rq.RQBackend
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-}

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  environment: *app-environment
  volumes:
    - sqlite_data:/data

services:
  redis:
    image: redis:8.10.2
    command: [redis-server, --appendonly, "yes", --appendfsync, always]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:6379:6379"

  migrate:
    <<: *app
    command: pdm run python manage.py migrate --noinput

  web:
    <<: *app
    command: pdm run python manage.py runserver 0.0.0.0:8000 --insecure
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  rqworker:
    <<: *app
    restart: unless-stopped
    command: pdm run python manage.py rqworker --job-class django_tasks_rq.Job
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  sqlite_data:
  redis_data:
