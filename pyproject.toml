[project]
name = "agentic-django-example"
dynamic = ["version"]
description = "Demo Django app showcasing the agentic-django library: agent runs, tool calling, HTMX UI, and optional background tasks"
authors = [
    {name = "B.T. Franklin", email = "brandon.franklin@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.14"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Framework :: Django",
]
dependencies = [
    "agentic-django[rq]>=0.5.1",
    "django-htmx>=1.29.0",
    "django-rq>=4.2.0",
    "promptdown>=1.1.6",
    "python-dotenv>=1.2.4",
    "psycopg[binary]>=3.3.6",
]

[project.urls]
Homepage = "https://github.com/btfranklin/agentic-django-example"
Issues = "https://github.com/btfranklin/agentic-django-example/issues"
Changelog = "https://github.com/btfranklin/agentic-django-example/releases"
Repository = "https://github.com/btfranklin/agentic-django-example.git"

[build-system]
requires = ["pdm-backend>=2.5.0"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
    "markdown-it-py>=4.2.0",
    "packaging>=26.3",
    "mypy>=2.4.0",
    "django-stubs>=6.1.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "agentic_django_example.settings"
python_files = ["test_*.py"]
pythonpath = ["apps"]

[tool.pdm.version]
source = "scm"

[tool.pdm.scripts]
lint = "ruff check ."
test = "pytest"
typecheck = "mypy"
docs = "perfect-doc check --offline --no-banner"
check = {composite = ["lint", "typecheck", "docs", "test"]}

[tool.mypy]
files = ["apps", "agentic_django_example", "tests", "manage.py"]
mypy_path = "apps"
plugins = ["mypy_django_plugin.main"]
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true
show_error_codes = true

[tool.django-stubs]
django_settings_module = "agentic_django_example.settings"
